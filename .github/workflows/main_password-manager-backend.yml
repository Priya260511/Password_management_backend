name: Build and deploy JAR app to Azure Web App - password-manager-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3df4c1f6e9b2c5a7d8e4f1a2b3c4d5e6f7a8b9c0

      - name: Set up Java version
        uses: actions/setup-java@6f4b2c8d9a1e3f7b5c2d4e6a8b9c1d2e3f4a5b6c
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@a8b9c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
  
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0
        with:
          name: java-app
      
      - name: Login to Azure
        uses: azure/login@f4c2d3e8b7c6a5d4e3f2a1b9c8d7e6f5a4b3c2d1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_439CF56A0B8946BF90B679727E504CF2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8C75797DCDC34D73BF5DC3CE4C325065 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_13FD2DB264054050B4A5BE6880EC54F8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0
        with:
          app-name: 'password-manager-backend'
          slot-name: 'Production'
          package: '*.jar'
